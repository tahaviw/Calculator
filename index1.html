<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="display">
            <span id="container-result"></span>
        </div>
        <div class="BTN">
            <button id="btn-1">1</button>
            <button id="btn-2">2</button>
            <button id="btn-3">3</button>
            <button id="key-del">del</button>
            <button id="btn-4">4</button>
            <button id="btn-5">5</button>
            <button id="btn-6">6</button>
            <button class="btn-op" id="key-minus">-</button>
            <button id="btn-7">7</button>
            <button id="btn-8">8</button>
            <button id="btn-9">9</button>
            <button class="btn-op" id="key-addition">+</button>
            <button id="key-dot">.</button>
            <button id="btn-0">0</button>
            <button class="btn-op" id="key-multplication">x</button>
            <button class="btn-op" id="key-division">÷</button>
            <button id="key-ac">AC</button>
            <button id="key-equal">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
